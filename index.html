<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Mauro Druwel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description"
        content="Hi, I'm Mauro Druwel, a 17-year-old inventor from Belgium. I'm passionate about science and engineering, and I love creating new things. I've created a number of inventions. You can find them on this website! I'm always looking for new challenges, so if you have any ideas, let me know!">
    <meta name="keywords"
        content="Young, Inventor, Belgium, Mauro, Druwel, Ingelmunster, Amigo, Coderdojo, programmer, dev">
    <meta name="author" content="Mauro Druwel">
    <link rel="stylesheet" href="./assets/css/icons.css">
    <link rel="stylesheet" href="./assets/css/picture.css">
    <link rel="stylesheet" href="./assets/css/main.css">
    <link rel="icon" href="./assets/favicon.ico" type="image/x-icon">
</head>

<body>
    <div id="bar"></div>
    <header class="w3-display-container w3-content w3-wide" style="max-width:3200px;" id="home">
        <img class="w3-image" src="./assets/IMG_0450.jpg" alt="Architecture" width="3200" height="800" loading="lazy">
        <div class="w3-display-left w3-margin-top w3-center">
            <h1 class="w3-xxlarge w3-text-white"><span class="w3-padding w3-black w3-opacity-min"><b>Mauro</b></span>
            </h1>
        </div>
    </header>
    <main class="w3-content w3-padding" style="max-width:1564px">
        <!-- Events Section -->
        <section class="w3-container w3-padding-32" id="Events">
            <h3 class="w3-border-bottom w3-border-light-grey w3-padding-16">Events</h3>
            <!-- Content loaded dynamically from assets/data/events.json -->
        </section>

        <!-- Maker Section -->
        <section class="w3-container w3-padding-32" id="Maker">
            <h3 class="w3-border-bottom w3-border-light-grey w3-padding-16">Maker</h3>
            <!-- Content loaded dynamically from assets/data/maker.json -->
        </section>


        <!-- Future Section -->
        <section class="w3-container w3-padding-32" id="Future">
            <!-- Titel Future -->
            <h3 class="w3-border-bottom w3-border-light-grey w3-padding-16">Future</h3>
            <!-- Future inhoud -->
            <h4 class="w3-padding-16">Kalender</h4>
            <table class="w3-table w3-bordered w3-border">
                <tr>
                    <th>Naam</th>
                    <th>Datum</th>
                </tr>
            </table>

            <h4 class="w3-padding-16">Skyline Park</h4>
            <div class="w3-row-padding w3-stretch">
                <div class="w3-col l3 m6 w3-margin-bottom">
                    <div class="w3-display-container">
                        <img class="modal-img" src="./assets/0P4A3988.jpg" alt="bron Skyline" loading="lazy"
                            style="width:100%;height:200px;object-fit:cover;object-position:80% 20%;">
                    </div>
                </div>
                <div class="w3-col l3 m6 w3-margin-bottom">
                    <div class="w3-display-container">
                        <img class="modal-img" src="./assets/0P4A3979.jpg" alt="bron Skyline" loading="lazy"
                            style="width:100%;height:200px;object-fit:cover;object-position:50% 50%;">
                    </div>
                </div>
            </div>
            <h5>Bezoek aan Skyline Park bij CTO Bert Vandenberghe. Superleuke ervaring! Dit wil ik in de toekomst meer
                doen!</h5>
        </section>
        <!-- Modal HTML structure -->
        <div id="myModal" class="modal">
            <span class="close">&times;</span>
            <img id="img01" class="modal-content" alt="">
            <div id="caption"></div>
        </div>
    </main>
    <script src="./assets/js/navbar.js" defer></script>
    <script src="./assets/js/picture.js" defer></script>
    <script src="./assets/js/eventsLoader.js" defer></script>
    <script src="./assets/js/makerLoader.js" defer></script>
</body>

</html>
